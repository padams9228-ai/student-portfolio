<div class="wrap page-title"><p class="eyebrow">Project I</p><h1>Calculator with <em>history</em></h1><div class="rule"></div><p>Basic arithmetic, with your last five calculations listed underneath.</p></div>
<section>
<div class="wrap">
<div class="card calc">
<div class="calc-screen"><small id="expr"></small><output id="display" aria-live="polite">0</output></div>
<div class="keys">
<button data-k="C">C</button><button data-k="DEL">&#9003;</button><button data-k="%">%</button><button data-k="÷" class="op">&divide;</button>
<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="×" class="op">&times;</button>
<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="−" class="op">&minus;</button>
<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
<button data-k="0">0</button><button data-k=".">.</button><button data-k="=" class="op" style="grid-column:span 2">=</button>
</div>
<ul id="history" aria-label="Calculation history"></ul>
</div>
<p style="text-align:center"><a href="projects.html">&larr; Back to projects</a></p>
</div>
