<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Planner | Pererat Adams</title>
<meta name="description" content="Plan study tasks and deadlines.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>
<header class="site-header">
<div class="bar">
<a class="brand" href="index.html">P. Adams</a>
<button class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false" aria-controls="menu">&#9776;</button>
<nav class="nav" aria-label="Main navigation"><ul id="menu"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="planner.html" aria-current="page">Planner</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
</div>
</header>
<main>

<div class="wrap page-title"><p class="eyebrow">Planner</p><h1>Academic <em>planner</em></h1><div class="rule"></div><p>Add tasks, tick them when done, and delete what you no longer need. Your tasks stay saved in this browser.</p></div>
<section>
<div class="wrap">
<div class="card">
<form id="taskForm" class="add-task" novalidate>
<label for="taskInput" style="position:absolute;left:-9999px">Task</label>
<input type="text" id="taskInput" placeholder="For example: Revise networking notes" maxlength="120">
<label for="taskDate" style="position:absolute;left:-9999px">Due date</label>
<input type="date" id="taskDate">
<button class="btn" type="submit">Add task</button>
</form>
<p class="error" id="taskMsg" role="alert"></p>
<ul id="taskList"></ul>
<div class="stats"><span id="count">0 of 0 completed</span><button class="btn ghost" id="clearDone" type="button" style="padding:.55rem 1.1rem">Clear completed</button></div>
</div>
</div>
</section>
</main>
<footer class="site-footer">
<p>&copy; 2026 Pererat Adams &middot; Abuja, Nigeria</p>
</footer>
<script src="main.js"></script>
<script src="planner.js"></script>
</body>
</html>
